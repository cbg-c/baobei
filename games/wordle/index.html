<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="game-header">
            <a href="../../index.html" id="home-btn" title="Back to Dailydle">
                <svg xmlns="http://www.w3.org/2000/svg" height="28" viewBox="0 0 24 24" width="28" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </a>
            <div class="toggle-container">
                <button id="mode-daily" class="mode-btn active">Daily</button>
                <button id="mode-unlimited" class="mode-btn">Unlimited</button>
            </div>
        </header>
        <div id="play-area">
            <div id="board-container">
                <div id="board"></div>
            </div>
            <div id="keyboard-container">
                <div id="keyboard"></div>
            </div>
        </div>
        <div id="message-container">
            <div id="message"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
